<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloorEver Admin Portal</title>
    
    <link rel="icon" type="image/png" href="images/Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .font-oswald { font-family: 'Oswald', sans-serif; }
        body { font-family: 'Work Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- TOP NAVIGATION -->
    <nav class="bg-[#032338] shadow-md py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="shield-check" class="text-[#93e6ff] w-8 h-8"></i>
            <span class="font-oswald text-2xl font-bold text-white tracking-wide uppercase">Admin Portal</span>
        </div>
        <button id="logout-btn" class="hidden text-gray-300 hover:text-white transition-colors flex items-center gap-2">
            <i data-lucide="log-out" class="w-5 h-5"></i> Logout
        </button>
    </nav>

    <main class="max-w-5xl mx-auto p-6 mt-8">
        
        <!-- INITIAL LOADING STATE -->
        <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
            <i data-lucide="loader-2" class="w-12 h-12 animate-spin text-[#032338] mb-4"></i>
            <p class="font-oswald text-xl text-gray-500 tracking-wide uppercase">Verifying Access...</p>
        </div>

        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="hidden max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-200 mt-10">
            <h2 class="font-oswald text-3xl font-bold text-[#032338] mb-6 text-center uppercase">Secure Login</h2>
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 font-oswald tracking-wide uppercase">Email Address</label>
                    <input type="email" id="login-email" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded focus:outline-none focus:border-[#032338]" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 font-oswald tracking-wide uppercase">Password</label>
                    <input type="password" id="login-password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded focus:outline-none focus:border-[#032338]" required>
                </div>
                <div id="login-error" class="hidden text-red-600 text-sm font-bold bg-red-50 p-3 rounded"></div>
                <button type="submit" class="w-full bg-[#e00603] hover:bg-red-700 text-white py-3 rounded font-oswald text-xl font-bold tracking-wider transition-colors">
                    LOGIN
                </button>
            </form>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="dashboard-screen" class="hidden space-y-8">
            
            <!-- PROJECT FORM (Used for both Adding and Editing) -->
            <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-[#93e6ff]" id="form-top-border"></div>
                <h2 id="form-title" class="font-oswald text-2xl font-bold text-[#032338] mb-6 uppercase flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-6 h-6 text-[#032338]"></i> Add New Project
                </h2>
                
                <form id="project-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2 font-oswald uppercase">Project Name</label>
                            <input type="text" id="proj-name" placeholder="e.g. The Smith Garage" class="w-full px-4 py-2 border rounded focus:border-[#032338] outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2 font-oswald uppercase">Category</label>
                            <select id="proj-category" class="w-full px-4 py-2 border rounded bg-white focus:border-[#032338] outline-none" required>
                                <option value="commercial">Commercial & Industrial</option>
                                <option value="residential">Residential</option>
                                <option value="outdoor">Outdoor Spaces</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-oswald uppercase">Image Path/URL</label>
                        <input type="text" id="proj-image" placeholder="images/Project1.jpg (or full web URL)" class="w-full px-4 py-2 border rounded focus:border-[#032338] outline-none" required>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-oswald uppercase">Short Description</label>
                        <textarea id="proj-desc" rows="2" placeholder="Describe the job..." class="w-full px-4 py-2 border rounded focus:border-[#032338] outline-none" required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 font-oswald uppercase">Bullet Points (Comma Separated)</label>
                        <input type="text" id="proj-bullets" placeholder="Diamond ground, Flake broadcast, Polyaspartic topcoat" class="w-full px-4 py-2 border rounded focus:border-[#032338] outline-none">
                        <p class="text-xs text-gray-500 mt-1">Separate each feature with a comma.</p>
                    </div>

                    <div class="flex gap-4">
                        <button type="submit" id="submit-project-btn" class="bg-[#032338] hover:bg-gray-800 text-white px-6 py-3 rounded font-oswald font-bold tracking-wider transition-colors flex-grow md:flex-grow-0">
                            SAVE TO DATABASE
                        </button>
                        <!-- Cancel Edit Button -->
                        <button type="button" id="cancel-edit-btn" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-3 rounded font-oswald font-bold tracking-wider transition-colors">
                            CANCEL EDIT
                        </button>
                    </div>
                    
                    <div id="action-success" class="hidden text-green-600 font-bold mt-3"></div>
                </form>
            </div>

            <!-- CURRENT PROJECTS LIST -->
            <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200">
                <h2 class="font-oswald text-2xl font-bold text-[#032338] mb-6 uppercase flex items-center gap-2">
                    <i data-lucide="folder-open" class="w-6 h-6 text-[#032338]"></i> Manage Current Projects
                </h2>
                
                <div id="projects-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Projects injected here via JavaScript -->
                </div>
            </div>

        </div>
    </main>

    <!-- FIREBASE & LOGIC SCRIPT (Must be type="module") -->
    <script type="module">
        // 1. Import Firebase SDKs (INCLUDING updateDoc)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // 2. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC21GSGjGST_xtvS1d8sfkUDMHCDzOL0tw",
            authDomain: "flooreveretx-7083b.firebaseapp.com",
            projectId: "flooreveretx-7083b",
            storageBucket: "flooreveretx-7083b.firebasestorage.app",
            messagingSenderId: "840978108031",
            appId: "1:840978108031:web:ea008314dd1fecdbac394a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Elements
        const loadingScreen = document.getElementById('loading-screen');
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const logoutBtn = document.getElementById('logout-btn');
        const projectsList = document.getElementById('projects-list');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-project-btn');
        const formTopBorder = document.getElementById('form-top-border');

        // State Variables
        let allProjects = {}; // Stores fetched data so we can populate the edit form
        let editingProjectId = null; // Keeps track of what we are currently editing

        lucide.createIcons();

        // 3. Auth Observer
        onAuthStateChanged(auth, (user) => {
            loadingScreen.classList.add('hidden');
            if (user) {
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                loadProjects();
            } else {
                loginScreen.classList.remove('hidden');
                dashboardScreen.classList.add('hidden');
                logoutBtn.classList.add('hidden');
            }
        });

        // 4. Login Logic
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => errorDiv.classList.add('hidden'))
                .catch((error) => {
                    errorDiv.textContent = "Invalid email or password.";
                    errorDiv.classList.remove('hidden');
                });
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        // 5. Submit Form Logic (Handles BOTH Add and Edit)
        document.getElementById('project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const originalText = submitBtn.innerText;
            submitBtn.innerHTML = 'SAVING...';
            submitBtn.disabled = true;

            const bulletsString = document.getElementById('proj-bullets').value;
            const bulletsArray = bulletsString ? bulletsString.split(',').map(item => item.trim()) : [];

            // Compile the data object
            const projectData = {
                name: document.getElementById('proj-name').value,
                category: document.getElementById('proj-category').value,
                image: document.getElementById('proj-image').value,
                description: document.getElementById('proj-desc').value,
                bullets: bulletsArray
            };

            try {
                if (editingProjectId) {
                    // WE ARE EDITING - Update existing document
                    await updateDoc(doc(db, "projects", editingProjectId), projectData);
                    showSuccessMessage("Project updated successfully!");
                } else {
                    // WE ARE ADDING - Create new document
                    projectData.createdAt = new Date(); // Only stamp creation date on new projects
                    await addDoc(collection(db, "projects"), projectData);
                    showSuccessMessage("Project added successfully!");
                }
                
                resetFormState();
                loadProjects(); 
            } catch (e) {
                alert("Error saving project: " + e.message);
            }
            
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        });

        // Small helper to flash success message
        function showSuccessMessage(msg) {
            const successDiv = document.getElementById('action-success');
            successDiv.innerText = msg;
            successDiv.classList.remove('hidden');
            setTimeout(() => successDiv.classList.add('hidden'), 3000);
        }

        // 6. Reset Form State (Back to Add Mode)
        function resetFormState() {
            editingProjectId = null;
            document.getElementById('project-form').reset();
            formTitle.innerHTML = '<i data-lucide="plus-circle" class="w-6 h-6 text-[#032338]"></i> Add New Project';
            submitBtn.innerText = 'SAVE TO DATABASE';
            submitBtn.className = 'bg-[#032338] hover:bg-gray-800 text-white px-6 py-3 rounded font-oswald font-bold tracking-wider transition-colors flex-grow md:flex-grow-0';
            formTopBorder.className = 'absolute top-0 left-0 w-full h-1 bg-[#93e6ff]';
            cancelEditBtn.classList.add('hidden');
            lucide.createIcons();
        }

        cancelEditBtn.addEventListener('click', resetFormState);

        // 7. Load & Display Projects
        async function loadProjects() {
            projectsList.innerHTML = '<p class="text-gray-500">Loading projects...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "projects"));
                projectsList.innerHTML = ''; 
                allProjects = {}; // Clear old data cache
                
                if(querySnapshot.empty) {
                    projectsList.innerHTML = '<p class="text-gray-500 italic">No projects found. Add your first one above!</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    allProjects[id] = data; // Save to global cache so we can edit it later
                    
                    const card = document.createElement('div');
                    card.className = "bg-gray-50 border border-gray-200 rounded p-4 flex justify-between items-center group hover:bg-white hover:shadow transition-all";
                    
                    card.innerHTML = `
                        <div class="flex items-center gap-4">
                            <img src="${data.image}" alt="thumb" onerror="this.src='https://placehold.co/100x100?text=No+Img'" class="w-16 h-16 object-cover rounded bg-gray-200 shadow-sm border border-gray-100">
                            <div>
                                <h4 class="font-bold text-[#032338] truncate w-32 md:w-48">${data.name}</h4>
                                <span class="text-[10px] font-bold text-white bg-[#032338] px-2 py-0.5 rounded uppercase tracking-wider">${data.category}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 opacity-60 group-hover:opacity-100 transition-opacity">
                            <button class="text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-2 rounded" onclick="window.triggerEdit('${id}')" title="Edit Project">
                                <i data-lucide="edit" class="w-5 h-5"></i>
                            </button>
                            <button class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded" onclick="window.deleteProject('${id}')" title="Delete Project">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                    `;
                    projectsList.appendChild(card);
                });
                lucide.createIcons();
            } catch (e) {
                projectsList.innerHTML = `<p class="text-red-500">Error loading projects: ${e.message}</p>`;
            }
        }

        // 8. Edit Project Trigger (Fills form and scrolls to top)
        window.triggerEdit = function(id) {
            editingProjectId = id;
            const proj = allProjects[id]; // Retrieve project from cache
            
            // Populate form
            document.getElementById('proj-name').value = proj.name || "";
            document.getElementById('proj-category').value = proj.category || "commercial";
            document.getElementById('proj-image').value = proj.image || "";
            document.getElementById('proj-desc').value = proj.description || "";
            document.getElementById('proj-bullets').value = (proj.bullets || []).join(', ');

            // Change Form UI to "Edit Mode"
            formTitle.innerHTML = `<i data-lucide="edit-3" class="w-6 h-6 text-blue-600"></i> Edit Project: ${proj.name}`;
            formTopBorder.className = 'absolute top-0 left-0 w-full h-1 bg-blue-600';
            submitBtn.innerText = 'UPDATE PROJECT';
            submitBtn.className = 'bg-blue-600 hover:bg-blue-800 text-white px-6 py-3 rounded font-oswald font-bold tracking-wider transition-colors flex-grow md:flex-grow-0';
            cancelEditBtn.classList.remove('hidden');
            
            lucide.createIcons();
            
            // Smoothly scroll the user back to the top to see the form
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 9. Delete Project Logic
        window.deleteProject = async function(id) {
            if(confirm("Are you sure you want to delete this project? This cannot be undone.")) {
                try {
                    await deleteDoc(doc(db, "projects", id));
                    
                    // If they delete the project while editing it, reset the form
                    if(editingProjectId === id) resetFormState(); 
                    
                    loadProjects(); // Refresh list
                } catch(e) {
                    alert("Error deleting project: " + e.message);
                }
            }
        };
    </script>
</body>
</html>
